name: Keep demo alive

# Supabase free projects pause after ~7 days without database activity.
# This pings an API endpoint that queries the database twice a week.
on:
  schedule:
    - cron: "17 14 * * 1,4"   # Mon & Thu, 14:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render and query Supabase
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
              "https://bird-migration-api.onrender.com/nightlight?year=2024") || code=000
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          exit 1
